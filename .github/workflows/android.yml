name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore (اختیاری)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "امضا با کلید ثابت (KEYSTORE_BASE64)"
          else
            echo "::warning::Secret KEYSTORE_BASE64 تعریف نشده؛ APK با کلید آزمایشی امضا می‌شود و روی نسخهٔ قبلی به‌روز نمی‌شود."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk copper-academy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: copper-academy-apk
          path: copper-academy.apk

      - name: نسخه
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: انتشار در Releases (دانلود عمومی APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-build${{ github.run_number }}
          name: مس‌آموز ${{ steps.ver.outputs.name }} (ساخت ${{ github.run_number }})
          files: copper-academy.apk
          make_latest: true
